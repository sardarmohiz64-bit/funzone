<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dice Roller - FunZone</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; text-align: center; padding-top: 50px; min-height: 100vh; margin: 0; }
    a { color: #6366f1; text-decoration: none; font-size: 1.2rem; display: inline-block; margin-bottom: 30px; }
    a:hover { text-decoration: underline; }
    .dice-box { font-size: 100px; margin: 30px; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center; background: #1e293b; border-radius: 20px; margin: 0 auto; border: 2px solid #334155; }
    button { background: #6366f1; color: white; border: none; padding: 15px 40px; font-size: 1.2rem; border-radius: 10px; cursor: pointer; margin-top: 40px; transition: 0.2s; }
    button:hover { background: #4f46e5; transform: scale(1.05); }
  </style>
</head>
<body>
  <a href="../index.html">⬅️ Wapas Home</a>
  
  <h1>🎲 Dice Roller</h1>
  <p>Button dabayein aur dekhein kya aata hai!</p>

  <div class="dice-box" id="dice">⚀</div>
  
  <button onclick="rollDice()">Roll Dice</button>

  <script>
    function rollDice() {
      // 1 se 6 tak random number generate karna
      const randomNumber = Math.floor(Math.random() * 6) + 1;
      const diceDiv = document.getElementById('dice');
      
      // Number ke hisaab se dice ka emoji change karna
      if (randomNumber === 1) diceDiv.innerHTML = '⚀';
      if (randomNumber === 2) diceDiv.innerHTML = '⚁';
      if (randomNumber === 3) diceDiv.innerHTML = '⚂';
      if (randomNumber === 4) diceDiv.innerHTML = '⚃';
      if (randomNumber === 5) diceDiv.innerHTML = '⚄';
      if (randomNumber === 6) diceDiv.innerHTML = '⚅';
    }
  </script>
</body>
</html>
