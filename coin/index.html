<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coin Flip - FunZone</title>
  <style>
    body { 
      font-family: system-ui, sans-serif; color: #e2e8f0; text-align: center; padding-top: 40px; 
      min-height: 100vh; margin: 0; overflow-x: hidden;
      /* NAYA THEME */
      background-color: #0d1117;
      background-image: linear-gradient(rgba(99, 102, 241, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(99, 102, 241, 0.1) 1px, transparent 1px);
      background-size: 40px 40px; background-position: center center; background-attachment: fixed;
    }
    body::before {
      content: ''; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 100vw; height: 100vh; background: radial-gradient(circle at center, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
      z-index: -1; pointer-events: none;
    }
    a { color: #818cf8; text-decoration: none; font-size: 1.2rem; display: inline-block; margin-bottom: 30px; font-weight: bold; }
    a:hover { text-decoration: underline; text-shadow: 0 0 10px rgba(129, 140, 248, 0.5); }
    h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(to right, #818cf8, #e879f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .scene { width: 160px; height: 160px; perspective: 1000px; margin: 50px auto; }
    .coin { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 2.5s cubic-bezier(0.25, 0.1, 0.15, 1); transform: rotateY(0deg); }
    .side { 
      position: absolute; width: 100%; height: 100%; border-radius: 50%; backface-visibility: hidden; 
      display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; color: #854d0e; 
      background: radial-gradient(circle at 30% 30%, #fef08a, #eab308, #a16207);
      box-shadow: inset 0 0 0 6px #ca8a04, inset 0 0 20px rgba(0,0,0,0.5), 0 10px 20px rgba(0,0,0,0.5);
      text-shadow: 1px 1px 2px rgba(255,255,255,0.5);
    }
    .tails { transform: rotateY(180deg); }
    #result-text { font-size: 1.5rem; margin-top: 20px; font-weight: bold; color: #fde047; min-height: 30px; text-shadow: 0 0 10px rgba(253, 224, 71, 0.5); }
    
    button { 
      background: rgba(99, 102, 241, 0.8); backdrop-filter: blur(10px); color: white; border: 1px solid rgba(255,255,255,0.2); 
      padding: 15px 40px; font-size: 1.2rem; border-radius: 10px; cursor: pointer; margin-top: 30px; transition: 0.3s; 
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }
    button:hover { background: rgba(99, 102, 241, 1); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6); }
    button:disabled { background: #475569; cursor: not-allowed; opacity: 0.7; transform: none; box-shadow: none; }
  </style>
</head>
<body>
  <a href="../index.html">⬅️ Wapas Home</a>
  <h1>🪙 Coin Flip</h1>
  <p>Button dabayein aur sikka uchhalen!</p>
  <div class="scene"><div class="coin" id="coin"><div class="side heads">Heads</div><div class="side tails">Tails</div></div></div>
  <div id="result-text"></div>
  <button id="flipBtn" onclick="flipCoin()">Uchhalo (Flip)</button>
  <script>
    let isFlipping = false; let currentRotation = 0;
    function flipCoin() {
      if (isFlipping) return; isFlipping = true;
      const coin = document.getElementById('coin'); const flipBtn = document.getElementById('flipBtn'); const resultText = document.getElementById('result-text');
      flipBtn.disabled = true; resultText.innerHTML = "Uchhal raha hai...";
      const isHeads = Math.random() < 0.5; const targetRotation = isHeads ? 0 : 180;
      const spins = 5 * 360; const baseRotation = Math.floor(currentRotation / 360) * 360;
      const newRotation = baseRotation + spins + targetRotation;
      coin.style.transform = `rotateY(${newRotation}deg)`; currentRotation = newRotation;
      setTimeout(() => {
        isFlipping = false; flipBtn.disabled = false;
        resultText.innerHTML = isHeads ? "🎉 Result: HEADS!" : "🎉 Result: TAILS!";
      }, 2500);
    }
  </script>
</body>
</html>
