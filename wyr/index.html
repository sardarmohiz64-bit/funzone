<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Would You Rather - FunZone</title>
  <style>
    body { 
      font-family: system-ui, sans-serif; color: #e2e8f0; text-align: center; padding-top: 30px; 
      min-height: 100vh; margin: 0; overflow-x: hidden; display: flex; flex-direction: column; align-items: center;
      /* NAYA THEME */
      background-color: #0d1117;
      background-image: linear-gradient(rgba(99, 102, 241, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(99, 102, 241, 0.1) 1px, transparent 1px);
      background-size: 40px 40px; background-position: center center; background-attachment: fixed;
    }
    body::before {
      content: ''; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 100vw; height: 100vh; background: radial-gradient(circle at center, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
      z-index: -1; pointer-events: none;
    }
    a { color: #818cf8; text-decoration: none; font-size: 1.2rem; display: inline-block; margin-bottom: 20px; align-self: flex-start; margin-left: 20px; font-weight: bold; }
    a:hover { text-decoration: underline; text-shadow: 0 0 10px rgba(129, 140, 248, 0.5); }
    h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(to right, #818cf8, #e879f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .game-container { width: 100%; max-width: 800px; padding: 20px; display: flex; flex-direction: column; align-items: center; }
    .question-box { display: flex; justify-content: space-between; align-items: stretch; width: 100%; gap: 20px; margin-top: 30px; position: relative; }
    
    .vs-badge { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #fde047; color: #0f172a; font-weight: bold; font-size: 1.2rem; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 50%; box-shadow: 0 0 20px rgba(253, 224, 71, 0.6); z-index: 10; border: 3px solid #0f172a; }
    
    .option { 
      flex: 1; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 2px solid rgba(99, 102, 241, 0.3); 
      border-radius: 16px; padding: 30px 20px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: all 0.3s ease; 
      display: flex; align-items: center; justify-content: center; min-height: 150px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    .option:hover { border-color: #818cf8; transform: translateY(-5px); background: rgba(30, 41, 59, 0.9); box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3); }
    .option.selected { border-color: #10b981; background: rgba(16, 185, 129, 0.2); transform: scale(1.05); box-shadow: 0 0 20px rgba(16, 185, 129, 0.4); }
    .option.faded { opacity: 0.3; transform: scale(0.95); }
    
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    
    @media (max-width: 600px) { .question-box { flex-direction: column; gap: 40px; } .vs-badge { top: 50%; } }
  </style>
</head>
<body>
  <a href="../index.html">⬅️ Wapas Home</a>
  <div class="game-container">
    <h1>❓ Would You Rather</h1>
    <p>Apni pasand ka option choose karein!</p>
    <div class="question-box fade-in" id="questionBox">
      <div class="vs-badge">VS</div>
      <div class="option" id="optionA" onclick="chooseOption('A')">Option A</div>
      <div class="option" id="optionB" onclick="chooseOption('B')">Option B</div>
    </div>
  </div>
  <script>
    const questions = [
      { a: "Hamesha 10 minute late hona", b: "Hamesha 20 minute early hona" },
      { a: "Social media hamesha ke liye chhor dena", b: "Movies aur series hamesha ke liye chhor dena" },
      { a: "Udne ki taqat (Fly)", b: "Ghayab hone ki taqat (Invisible)" },
      { a: "Zindagi bhar sirf Biryani khana", b: "Zindagi bhar sirf Pizza khana" },
      { a: "Unlimited paisa", b: "Unlimited waqt" },
      { a: "Apni pasand ki job aur kam tankhwah", b: "Napasand ki job aur moti tankhwah" },
      { a: "Hamesha sach bolna", b: "Hamesha jhoot bolna" },
      { a: "Dunya ka sab se ameer insaan banna", b: "Dunya ka sab se aqalmand insaan banna" },
      { a: "Hamesha mobile par 2G internet", b: "Hamesha mobile par 0% battery" },
      { a: "Har roz subah 5 baje uthna", b: "Har raat 3 baje tak na sona" }
    ];
    let currentQuestionIndex = 0;
    function loadQuestion() {
      const optionA = document.getElementById('optionA'); const optionB = document.getElementById('optionB'); const questionBox = document.getElementById('questionBox');
      optionA.className = 'option'; optionB.className = 'option'; questionBox.classList.remove('fade-in');
      void questionBox.offsetWidth; questionBox.classList.add('fade-in');
      if (currentQuestionIndex >= questions.length) currentQuestionIndex = 0; 
      optionA.innerText = questions[currentQuestionIndex].a; optionB.innerText = questions[currentQuestionIndex].b;
    }
    function chooseOption(choice) {
      const optionA = document.getElementById('optionA'); const optionB = document.getElementById('optionB');
      if (optionA.classList.contains('selected') || optionB.classList.contains('selected')) return;
      if (choice === 'A') { optionA.classList.add('selected'); optionB.classList.add('faded'); } 
      else { optionB.classList.add('selected'); optionA.classList.add('faded'); }
      setTimeout(() => { currentQuestionIndex++; loadQuestion(); }, 1200);
    }
    window.onload = loadQuestion;
  </script>
</body>
</html>
