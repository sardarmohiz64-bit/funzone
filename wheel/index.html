<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Name Wheel - FunZone</title>
  <style>
    body { 
      font-family: system-ui, sans-serif; color: #e2e8f0; text-align: center; padding-top: 30px; 
      min-height: 100vh; margin: 0; overflow-x: hidden;
      /* NAYA THEME */
      background-color: #0d1117;
      background-image: linear-gradient(rgba(99, 102, 241, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(99, 102, 241, 0.1) 1px, transparent 1px);
      background-size: 40px 40px; background-position: center center; background-attachment: fixed;
    }
    body::before {
      content: ''; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 100vw; height: 100vh; background: radial-gradient(circle at center, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
      z-index: -1; pointer-events: none;
    }
    a { color: #818cf8; text-decoration: none; font-size: 1.2rem; display: inline-block; margin-bottom: 20px; font-weight: bold; align-self: flex-start; margin-left: 20px;}
    a:hover { text-decoration: underline; text-shadow: 0 0 10px rgba(129, 140, 248, 0.5); }
    h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(to right, #818cf8, #e879f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .wheel-container { position: relative; width: 300px; height: 300px; margin: 30px auto; }
    .pointer { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 30px solid #ef4444; z-index: 10; filter: drop-shadow(0 4px 2px rgba(0,0,0,0.5)); }
    .wheel { width: 100%; height: 100%; border-radius: 50%; border: 8px solid #1e293b; box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.5); background: #334155; transition: transform 4s cubic-bezier(0.2, 0.8, 0.3, 1); transform: rotate(0deg); position: relative; overflow: hidden; }
    #labels-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .label-wrapper { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform-origin: 50% 50%; }
    .label-text { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 90px; text-align: center; font-weight: bold; color: #ffffff; font-size: 16px; text-shadow: 1px 1px 4px rgba(0,0,0,0.9); word-wrap: break-word; }
    
    .center-btn { 
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 70px; height: 70px; 
      background: rgba(99, 102, 241, 0.9); backdrop-filter: blur(5px); border: 4px solid #0f172a; border-radius: 50%; 
      color: white; font-weight: bold; font-size: 1.1rem; cursor: pointer; z-index: 5; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.5); transition: 0.2s; 
    }
    .center-btn:hover { background: rgba(99, 102, 241, 1); transform: translate(-50%, -50%) scale(1.1); box-shadow: 0 0 25px rgba(99, 102, 241, 0.8); }
    .center-btn:disabled { opacity: 0.8; cursor: not-allowed; }
    
    #result { font-size: 1.5rem; margin-top: 20px; font-weight: bold; color: #fde047; min-height: 35px; text-shadow: 0 0 10px rgba(253, 224, 71, 0.5); }
    
    .controls { margin-top: 20px; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 15px; border-radius: 10px; display: inline-block; text-align: left; border: 1px solid rgba(255,255,255,0.1); }
    .controls input { padding: 10px; border-radius: 5px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; width: 200px; }
    .controls button { padding: 10px 15px; border: none; background: #10b981; color: white; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s;}
    .controls button:hover { background: #059669; transform: scale(1.05); }
    .btn-clear { background: #ef4444 !important; margin-left: 10px; }
    .btn-clear:hover { background: #dc2626 !important; }
    #nameList { font-size: 0.9rem; color: #94a3b8; margin-top: 15px; max-width: 300px; }
  </style>
</head>
<body>
  <a href="../index.html">⬅️ Wapas Home</a>
  <h1>🎡 Name Wheel</h1>
  <p>Apni marzi se naam add karein aur pahiya ghumayein!</p>
  <div class="wheel-container">
    <div class="pointer"></div>
    <div class="wheel" id="wheel"><div id="labels-container"></div></div>
    <button class="center-btn" id="spinBtn" onclick="spinWheel()">SPIN</button>
  </div>
  <div id="result"></div>
  <div class="controls">
    <input type="text" id="nameInput" placeholder="Naya naam likhein...">
    <button onclick="addName()">+ Add</button>
    <button class="btn-clear" onclick="clearNames()">Clear All</button>
    <div id="nameList">Koi naam nahi hai. Naam add karein.</div>
  </div>
  <script>
    let names = []; const colors = ["#ef4444", "#3b82f6", "#10b981", "#eab308", "#8b5cf6", "#ec4899", "#f97316", "#14b8a6", "#06b6d4", "#84cc16"];
    let currentRotation = 0; let isSpinning = false;
    function drawWheel() {
      const wheel = document.getElementById('wheel'); const labelsContainer = document.getElementById('labels-container'); const nameListDiv = document.getElementById('nameList');
      const total = names.length; labelsContainer.innerHTML = ''; 
      if (total === 0) { wheel.style.background = '#334155'; nameListDiv.innerHTML = "Koi naam nahi hai. Neeche se naam add karein."; return; }
      const anglePerSlice = 360 / total; let gradientParts = [];
      for (let i = 0; i < total; i++) {
        const startAngle = i * anglePerSlice; const endAngle = (i + 1) * anglePerSlice; const color = colors[i % colors.length]; gradientParts.push(`${color} ${startAngle}deg ${endAngle}deg`);
        const wrapper = document.createElement('div'); wrapper.className = 'label-wrapper'; const midAngle = startAngle + (anglePerSlice / 2); wrapper.style.transform = `rotate(${midAngle}deg)`;
        const span = document.createElement('span'); span.className = 'label-text'; span.innerText = names[i];
        if (midAngle > 90 && midAngle < 270) span.style.transform = 'translateX(-50%) rotate(180deg)';
        wrapper.appendChild(span); labelsContainer.appendChild(wrapper);
      }
      wheel.style.background = `conic-gradient(${gradientParts.join(', ')})`; nameListDiv.innerHTML = "Total Naam (" + total + "): " + names.join(" • ");
    }
    function spinWheel() {
      const total = names.length; if (total < 2) { alert("Kam az kam 2 naam add karein!"); return; }
      if (isSpinning) return; isSpinning = true;
      const wheel = document.getElementById('wheel'); const spinBtn = document.getElementById('spinBtn'); const resultDiv = document.getElementById('result');
      spinBtn.disabled = true; resultDiv.innerHTML = "Ghoom raha hai...";
      const extraSpins = 1800 + Math.floor(Math.random() * 360); currentRotation += extraSpins; wheel.style.transform = `rotate(${currentRotation}deg)`;
      setTimeout(() => {
        isSpinning = false; spinBtn.disabled = false;
        const actualRotation = currentRotation % 360; const winningAngle = (360 - actualRotation) % 360;
        const anglePerSlice = 360 / total; const winningIndex = Math.floor(winningAngle / anglePerSlice);
        const winner = names[winningIndex >= total ? 0 : winningIndex]; resultDiv.innerHTML = `🎉 Winner: ${winner}! 🎉`;
      }, 4000); 
    }
    function addName() {
      const input = document.getElementById('nameInput'); const name = input.value.trim();
      if (name !== "" && names.length < 10) { names.push(name); input.value = ""; drawWheel(); } 
      else if (names.length >= 10) { alert("Max 10 naam add kar sakte hain."); }
    }
    function clearNames() { if(confirm("Saare naam delete karein?")) { names = []; drawWheel(); document.getElementById('result').innerHTML = ""; } }
    document.getElementById('nameInput').addEventListener('keypress', function (e) { if (e.key === 'Enter') addName(); });
    window.onload = drawWheel;
  </script>
</body>
</html>
