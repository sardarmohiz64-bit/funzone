<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Name Wheel - FunZone</title>
  <style>
    body { 
      font-family: system-ui, sans-serif; 
      background: #0f172a; 
      color: #e2e8f0; 
      text-align: center; 
      padding-top: 30px; 
      min-height: 100vh; 
      margin: 0; 
      overflow-x: hidden;
    }
    a { 
      color: #6366f1; 
      text-decoration: none; 
      font-size: 1.2rem; 
      display: inline-block; 
      margin-bottom: 20px; 
    }
    a:hover { text-decoration: underline; }

    /* Pahiye ka container */
    .wheel-container {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 30px auto;
    }

    /* Teer (Pointer) */
    .pointer {
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; 
      height: 0; 
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-top: 30px solid #ef4444; 
      z-index: 10;
      filter: drop-shadow(0 4px 2px rgba(0,0,0,0.5));
    }

    /* Asli Pahiya */
    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 8px solid #1e293b;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 0 20px rgba(0,0,0,0.5);
      transition: transform 4s cubic-bezier(0.2, 0.8, 0.3, 1);
      transform: rotate(0deg);
      position: relative;
      overflow: hidden;
    }

    /* Naam (Text) ka container */
    #labels-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Har naam ke liye wrapper jo center se ghomega */
    .label-wrapper {
      position: absolute;
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%;
      transform-origin: 50% 50%; 
    }

    /* Naam ka text */
    .label-text {
      position: absolute;
      top: 20px; /* Edge se thora sa andar */
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      text-align: center;
      font-weight: bold;
      color: #ffffff;
      font-size: 16px;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.9); /* Text ko wazeh karne ke liye */
      word-wrap: break-word;
    }

    /* Pahiye ke beech ka button */
    .center-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70px;
      height: 70px;
      background: #1e293b;
      border: 4px solid #0f172a;
      border-radius: 50%;
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      z-index: 5;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: 0.2s;
    }
    .center-btn:hover { background: #334155; transform: translate(-50%, -50%) scale(1.1); }
    .center-btn:disabled { opacity: 0.8; cursor: not-allowed; }

    /* Result Text */
    #result {
      font-size: 1.5rem;
      margin-top: 20px;
      font-weight: bold;
      color: #fde047;
      min-height: 35px;
    }

    /* Controls */
    .controls {
      margin-top: 20px;
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      display: inline-block;
      text-align: left;
    }
    .controls input {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #334155;
      background: #0f172a;
      color: white;
      outline: none;
      width: 200px;
    }
    .controls button {
      padding: 10px 15px;
      border: none;
      background: #10b981;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .controls button:hover { background: #059669; }
    #nameList {
      font-size: 0.9rem; 
      color: #94a3b8; 
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <a href="../index.html">⬅️ Wapas Home</a>
  
  <h1>🎡 Name Wheel</h1>
  <p>Bachon ke naam likhein aur pahiya ghumayein!</p>

  <div class="wheel-container">
    <div class="pointer"></div>
    <div class="wheel" id="wheel">
      <div id="labels-container"></div>
    </div>
    <button class="center-btn" id="spinBtn" onclick="spinWheel()">SPIN</button>
  </div>

  <div id="result"></div>

  <div class="controls">
    <input type="text" id="nameInput" placeholder="Naya naam likhein...">
    <button onclick="addName()">+ Add</button>
    <div id="nameList"></div>
  </div>

  <script>
    let names = ["Ali", "Sara", "Ahmed", "Zain", "Fatima", "Usman"];
    const colors = ["#ef4444", "#3b82f6", "#10b981", "#eab308", "#8b5cf6", "#ec4899", "#f97316", "#14b8a6"];
    
    let currentRotation = 0;
    let isSpinning = false;

    function drawWheel() {
      const wheel = document.getElementById('wheel');
      const labelsContainer = document.getElementById('labels-container');
      const nameListDiv = document.getElementById('nameList');
      const total = names.length;
      const anglePerSlice = 360 / total;
      
      let gradientParts = [];
      labelsContainer.innerHTML = ''; // Purane text saaf karein
      
      for (let i = 0; i < total; i++) {
        const startAngle = i * anglePerSlice;
        const endAngle = (i + 1) * anglePerSlice;
        const color = colors[i % colors.length];
        gradientParts.push(`${color} ${startAngle}deg ${endAngle}deg`);
        
        // --- TEXT SET KARNE KA NAYA LOGIC ---
        const wrapper = document.createElement('div');
        wrapper.className = 'label-wrapper';
        
        // Hisse ke beech ka angle nikalna
        const midAngle = startAngle + (anglePerSlice / 2);
        wrapper.style.transform = `rotate(${midAngle}deg)`;
        
        const span = document.createElement('span');
        span.className = 'label-text';
        span.innerText = names[i];
        
        // Agar text ulta (upside down) ho raha ho to usay seedha karein
        if (midAngle > 90 && midAngle < 270) {
          span.style.transform = 'translateX(-50%) rotate(180deg)';
        }
        
        wrapper.appendChild(span);
        labelsContainer.appendChild(wrapper);
      }
      
      wheel.style.background = `conic-gradient(${gradientParts.join(', ')})`;
      nameListDiv.innerHTML = "Total Naam: " + names.join(" • ");
    }

    function spinWheel() {
      if (isSpinning) return;
      isSpinning = true;

      const wheel = document.getElementById('wheel');
      const spinBtn = document.getElementById('spinBtn');
      const resultDiv = document.getElementById('result');
      
      spinBtn.disabled = true;
      resultDiv.innerHTML = "Ghoom raha hai...";

      const extraSpins = 1800 + Math.floor(Math.random() * 360);
      currentRotation += extraSpins;
      wheel.style.transform = `rotate(${currentRotation}deg)`;

      setTimeout(() => {
        isSpinning = false;
        spinBtn.disabled = false;

        const actualRotation = currentRotation % 360;
        const winningAngle = (360 - actualRotation) % 360;
        
        const total = names.length;
        const anglePerSlice = 360 / total;
        
        const winningIndex = Math.floor(winningAngle / anglePerSlice);
        const winner = names[winningIndex >= total ? 0 : winningIndex];

        resultDiv.innerHTML = `🎉 Winner: ${winner}! 🎉`;
      }, 4000); 
    }

    function addName() {
      const input = document.getElementById('nameInput');
      const name = input.value.trim();
      
      if (name !== "" && names.length < 12) { 
        names.push(name);
        input.value = ""; 
        drawWheel(); 
      } else if (names.length >= 12) {
        alert("Zyada se zyada 12 naam add kiye ja sakte hain taake pahiya saaf nazar aaye.");
      }
    }

    document.getElementById('nameInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') addName();
    });

    window.onload = drawWheel;
  </script>
</body>
</html>
